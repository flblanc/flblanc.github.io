name: Rare Events posts

# Runs when the Obsidian notes, the shared .bib or the converter change, regenerates
# _drafts/*.md and _posts/*.md from _notes/ and commits the result back to the branch.
# A note that fails to convert keeps its previous output; the run is then marked failed.
on:
  push:
    paths:
      - "_notes/**"
      - "tools/obsidian2post.py"
      - ".github/workflows/rare-events.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rare-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: convert
        run: python3 tools/obsidian2post.py
        continue-on-error: true
      - name: Commit regenerated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in _drafts _posts; do
            if [ -e "$d" ] || [ -n "$(git ls-files "$d")" ]; then git add -A "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Regenerate Rare Events posts"
            git push
          fi
      - if: steps.convert.outcome == 'failure'
        run: |
          echo "Some notes failed to convert; see the convert step's log."
          exit 1
