  # TEXT (brief message 3 — current question): how intrinsically disordered
  # regions contribute to motor function.
  # Each case below has its own functional verb and is deliberately NOT framed
  # as the same question applied to two systems. Keep them distinct.
  cases:
      # TEXT: label for the myosin 18 case.
    - title: ""
      # TEXT: the disordered N-terminal extension in F-actin binding/assembly.
      text: ""
      # TEXT: label for the kinesin case.
    - title: ""
      # TEXT: kinesins carrying disordered extensions, and processive motility.
      # Do not name a specific kinesin or describe a mechanism/hypothesis.
      text: ""

  # TEXT (brief message 4 — the gap): the role of disorder in motor function is
  # understudied relative to structured domains.
  # Word this carefully: do NOT claim it is "unexplored" in absolute terms.
  note: ""

  # TEXT: optional credit line. MyoAssemble may be named here, but only as a
  # funded ANR project on which you are a scientific partner. Do not name
  # DISOMOTOR or refer to any pending proposal.
  people: ""

