# Research lines shown on the home page, rendered by _includes/home-research.html.
#
# Order matters: the first entry is rendered as the PRIMARY block (full width,
# figure, larger type), later entries as SECONDARY blocks (narrower, lighter).
# This is what carries the "motor line is primary, silver-binding line is
# clearly secondary but distinct" weighting from the content brief.
#
# Fields:
#   id         internal handle, not displayed
#   weight     primary | secondary  (drives the visual treatment)
#   title      block heading
#   lead       opening sentences of the block, Markdown allowed
#   image      path under /images/... ; empty renders a placeholder panel
#   video      short muted loop; takes precedence over image if both are set
#   alt        alt text (required whenever image or video is set)
#   papers     list of bibkeys from _publications/, displayed inside this block
#   cases      optional sub-items, each with its own title + text
#   note       optional closing line of the block (e.g. the open-question framing)
#   people     optional credit line (trainees, collaborators, funded projects)

# ---------------------------------------------------------------------------
# PRIMARY LINE — molecular motors (brief messages 2, 3 and 4)
# ---------------------------------------------------------------------------
- id: motors
  weight: primary

  # TEXT: heading for the motor line.
  title: ""

  # TEXT (brief message 2 — track record): motors in a broad sense, spanning
