# Team members, rendered by _pages/team.md (/team/).
# Entries are shown in the order they appear in this file.
#
# Fields:
#   name       person's name
#   status     current | past
#   stages     one item per stage (e.g. M2 internship, then PhD); all fields optional
#     level           e.g. PhD, M2, M1, L3, engineering student, postdoc
#     dates           free text, e.g. "2026-" or "Feb-Jul 2026"
#     topic           project topic (Markdown allowed, e.g. links)
#     role            my role, e.g. supervisor, co-supervisor (50%)
#     co_supervisors  free text (Markdown allowed)
#     funding         free text (Markdown allowed)
#
# Template (copy, uncomment and fill):
#
# - name: ""
#   status: current
#   stages:
#     - level: ""
#       dates: ""
#       topic: ""
#       role: ""
#       co_supervisors: ""
#       funding: ""
